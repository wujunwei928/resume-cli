[project]
name = "resume-cli"
version = "0.1.0"
description = "AI 简历解析 CLI：PDF 文本提取、结构化信息提取、JD 匹配评分"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pdfplumber>=0.11",
]

[project.scripts]
resume-cli = "resume_cli.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "reportlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
